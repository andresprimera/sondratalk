server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long cache for hashed assets — Vite emits content-hashed filenames in /assets/.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry HTML — clients must always re-check for new bundles.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA fallback — all unknown paths render the React app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
