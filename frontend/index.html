<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap"
    />
    <title>Sondra. Real Human Conversation</title>
    <script>
      // Set the theme class before first paint so the app is dark by default
      // immediately on cold loads (e.g. arriving at beta.sondratalk.com from
      // sondratalk.com) — without this, next-themes only applies the class
      // after the bundle mounts, flashing the light :root theme first.
      // Mirrors the ThemeProvider config: storageKey "theme", default dark.
      (function () {
        try {
          var stored = localStorage.getItem("theme")
          document.documentElement.classList.toggle("dark", stored !== "light")
        } catch (e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
